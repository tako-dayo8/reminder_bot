name: deploy production 

on: 
  workflow_dispatch: # debug
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production -${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # if: ${{ github.event.pull_request.merged == true }} 
    uses: ./.github/workflows/docker-build-test.yml

  build-and-push:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .Dockerfile
          tags: | 
            ghcr.io/${{ github.repository_owner }}/bot:latest
            ghcr.io/${{ github.repository_owner }}/bot:${{ github.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: generate ssh key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
        
      - name: deploy
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SSH_PORT }} \
            ${{ secrets.DEPLOY_USER_NAME }}@${{ secrets.DEPLOY_HOST_IP }} \
              '${{ github.sha }}'